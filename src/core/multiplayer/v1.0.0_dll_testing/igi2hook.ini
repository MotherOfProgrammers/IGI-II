; place next to version.dll and igi2.exe
[igi2hook]

; 0 = LOG ONLY (stage 0: capture what the game does; nothing is redirected
; 1 = hostnames matching redirect_patterns resolve to master_host instead
enable_redirect=0

; Hostname or dotted IP that gamespy/udpsoft names are redirected to when
; enable_redirect=1.  Use the word  local  to mean "this PC's current LAN address"
; (the game ignores 127.0.0.1, and your LAN IP can change between sessions)
; For OpenSpy use the master hostname from OpenSpy's own docs
; For your own master use its IP or domain
master_host=

; Comma-separated, case-insensitive substrings of hostnames to redirect
; From the exe strings: master.gamespy.com, master.udpsoft.com, master2.udpsoft.com
redirect_patterns=gamespy.com,udpsoft.com

; 1 = change "\enctype\2\" to "\enctype\0\" in the game's master request
; NOT needed any more: master_server.py now encrypts the list with enctype 2, which is what the game really expects Keep 0
force_enctype0=0

; Payload bytes logged per packet (0-256)
log_bytes=96

; Stop logging after this many UDP/TCP packets (keeps the log small in a match)
log_udp_max=400
log_tcp_max=200

; 1 = let several igi2.exe run at once (fixes "innerloop game is already running" used to test hosting + joining on one PC)
; Named mutexes/events/mappings get the process id appended and windows of other game processes are hidden from FindWindow
allow_multi=0

; Announce a hosted game to the master from inside the game process
; The game sends its own heartbeats to <master>:27900 (once master_host is not loopback), so this is only a fallback/extra
; It announces the hosted game port when the game binds its hosting port a thread sends \heartbeat\<port>\gamename\<gamename> to master_host:master_udp_port every heartbeat_interval seconds
; The master takes the host's IP from the packet's source address
heartbeat=0

; 0 = detect automatically (the first UDP port the game binds when you host, so any port set in the game's host screen works (IGI 2's own default is 26001)
; N = only announce when the game binds port N
host_port=0
master_udp_port=27900
heartbeat_interval=30
gamename=projectigi2r